<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>[hidden]{display:none!important}</style>
<title>Небо открытий</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fira+Sans+Extra+Condensed:wght@600;700;800;900&family=IBM+Plex+Mono:wght@400;500;600&family=PT+Serif:ital,wght@0,400;0,700;1,400&display=swap">
<style>
/* one deliberate night look: the page is a sky */
:root{
  --bg:#0B0D14; --panel:rgba(15,18,26,.84); --line:rgba(255,255,255,.14);
  --text:#EDEBE5; --mut:#8E96A8; --yellow:#FFD812; --red:#FF5E42; --hint:#9AA3B5; --note:#BFD4FF;
  --display:"Fira Sans Extra Condensed","Arial Narrow",Arial,sans-serif;
  --serif:"PT Serif",Georgia,"Times New Roman",serif;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
  color-scheme:dark;
}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--text);font:400 16px/1.5 var(--serif);overflow:hidden;-webkit-font-smoothing:antialiased}
#stage{position:fixed;inset:0}
#stage canvas{display:block;width:100%;height:100%;touch-action:none;cursor:grab}
#stage canvas:active{cursor:grabbing}

#labels{position:fixed;inset:0;pointer-events:none;overflow:hidden}
.lbl{position:absolute;left:0;top:0;pointer-events:auto;background:none;border:0;margin:0;padding:3px 6px;color:var(--text);font:400 14px/1.15 var(--serif);white-space:nowrap;cursor:pointer;text-align:left;text-shadow:0 1px 8px #000,0 0 3px #000;transition:opacity .3s,filter .25s,color .2s}
.ck{display:inline-block;width:14px;height:14px;margin-right:6px;border-radius:50%;background:var(--yellow);color:#161616;font:700 9px/14px var(--mono);font-style:normal;text-align:center;vertical-align:1px;text-shadow:none}
.ck.q{background:none;border:1px dashed var(--hint);color:var(--hint);line-height:12px;width:12px;height:12px}
.lbl.k-root{font:900 28px/1 var(--display);text-transform:uppercase;letter-spacing:.02em;color:#FFF1B0}
.lbl.k-root .ck{display:none}
.lbl.k-page{font:800 21px/1 var(--display);text-transform:uppercase;letter-spacing:.02em}
.lbl.k-note{font:700 18px/1 var(--display);text-transform:uppercase;color:var(--note)}
.lbl.k-note .ck{background:var(--note)}
.lbl small{display:block;margin:4px 0 0 20px;font:500 10px/1.2 var(--mono);letter-spacing:.08em;color:var(--mut)}
.bud{display:inline-block;margin-left:8px;padding:3px 6px;border:1px dashed var(--hint);border-radius:999px;font:600 10px/1 var(--mono);font-style:normal;color:var(--hint);vertical-align:2px;text-shadow:none}
.bud[hidden]{display:none}
.lbl.hint{color:var(--hint);font-style:italic;filter:blur(1.8px)}
.lbl.hint.hov,.lbl.hint.sel,.lbl.hint:hover,.lbl.hint:focus-visible{filter:none;color:var(--text)}
.lbl.sel{color:var(--yellow)}
.lbl.k-root.sel{color:#FFF1B0}
.lbl.hov{text-decoration:underline;text-underline-offset:4px}
.lbl.off{opacity:0!important;pointer-events:none}
.lbl:focus-visible{outline:2px solid var(--yellow);outline-offset:2px}

.top{position:fixed;left:0;right:0;top:0;padding:calc(env(safe-area-inset-top,0px) + 16px) 20px 0;display:flex;justify-content:space-between;align-items:flex-start;gap:12px 16px;flex-wrap:wrap;pointer-events:none}
.top>*{pointer-events:auto}
h1{margin:0;font:900 clamp(30px,4vw,46px)/.9 var(--display);text-transform:uppercase;letter-spacing:.01em}
.crumbs{display:flex;flex-wrap:wrap;align-items:center;gap:4px 6px;margin-top:8px;max-width:60vw;font:500 11px/1.3 var(--mono);letter-spacing:.06em;text-transform:uppercase;color:var(--mut)}
.crumbs button{font:inherit;letter-spacing:inherit;text-transform:inherit;color:var(--mut);background:none;border:0;padding:2px 0;cursor:pointer}
.crumbs button:hover,.crumbs button:focus-visible{color:var(--yellow)}
.crumbs .here{color:var(--text)}
.crumbs i{font-style:normal;opacity:.5}
.right{display:flex;flex-direction:column;align-items:flex-end;gap:10px}
.counts{display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end}
.count{padding:6px 10px;border:1px solid var(--line);background:var(--panel);backdrop-filter:blur(8px);font:500 11px/1.2 var(--mono);letter-spacing:.06em;text-transform:uppercase;color:var(--mut)}
.count b{font:900 20px/1 var(--display);color:var(--yellow);margin-right:6px;vertical-align:-2px;font-variant-numeric:tabular-nums}
.count.h b{color:var(--hint)}
.ctrls{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
.variants{display:flex;gap:4px;padding:4px;border:1px solid var(--line);border-radius:999px;background:var(--panel);backdrop-filter:blur(8px);align-self:flex-start}
.variants button{font:600 12px/1 var(--mono);letter-spacing:.06em;text-transform:uppercase;color:var(--mut);background:none;border:0;border-radius:999px;padding:9px 14px;cursor:pointer}
.variants button:hover{color:var(--text)}
.variants button[aria-checked="true"]{background:var(--yellow);color:#161616}
.variants button:focus-visible{outline:2px solid var(--yellow);outline-offset:2px}
@media (max-width:720px){.variants{order:3;width:100%;justify-content:space-between}.variants button{padding:8px 10px}}
.btn{font:500 11px/1 var(--mono);letter-spacing:.06em;text-transform:uppercase;color:var(--text);background:var(--panel);border:1px solid var(--line);border-radius:999px;padding:8px 12px;cursor:pointer;backdrop-filter:blur(8px);text-decoration:none;display:inline-block}
.btn:hover{border-color:var(--yellow);color:var(--yellow)}
.btn[aria-pressed="true"],.btn[aria-expanded="true"]{border-color:var(--yellow)}
.btn.primary{background:var(--yellow);color:#161616;border-color:var(--yellow);padding:10px 14px}
.btn.primary:hover{background:#FFFFFF;color:#161616}
.btn:focus-visible{outline:2px solid var(--yellow);outline-offset:2px}

#card{position:fixed;left:20px;bottom:calc(env(safe-area-inset-bottom,0px) + 20px);width:min(360px,calc(100% - 40px));max-height:min(54vh,540px);overflow:auto;background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:16px 18px 18px;backdrop-filter:blur(12px)}
.chip{display:inline-block;font:600 10px/1 var(--mono);letter-spacing:.08em;text-transform:uppercase;padding:5px 8px 4px;border:1px solid var(--line);color:var(--text)}
.chip.hint{border-style:dashed;border-color:var(--hint);color:var(--hint)}
.chip.page,.chip.root{background:var(--yellow);border-color:var(--yellow);color:#161616}
.chip.note{border-color:var(--note);color:var(--note)}
#card h2{margin:10px 0 4px;font:800 32px/.95 var(--display);text-wrap:balance}
.yr{font:500 11px/1.3 var(--mono);color:var(--mut);letter-spacing:.06em}
.d{margin:10px 0 0;font-size:15px;line-height:1.5}
.small{margin:10px 0 0;font-size:13px;line-height:1.45;color:var(--mut)}
.actions{display:flex;flex-direction:column;align-items:flex-start;gap:10px;margin-top:14px}
.actions:empty{display:none}
pre{white-space:pre-wrap;margin:0;font:400 12px/1.45 var(--mono);color:var(--text);background:rgba(255,255,255,.04);border:1px dashed var(--hint);padding:10px;user-select:all;width:100%;box-sizing:border-box}
.toast{color:var(--yellow);font:600 11px var(--mono);letter-spacing:.06em;text-transform:uppercase}

#drawer{position:fixed;right:20px;top:calc(env(safe-area-inset-top,0px) + 132px);bottom:calc(env(safe-area-inset-bottom,0px) + 20px);width:min(320px,calc(100% - 40px));overflow:auto;background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:14px 16px 16px;backdrop-filter:blur(12px)}
#drawer h2{margin:0 0 10px;font:800 22px/1 var(--display);text-transform:uppercase}
#drawer ul{list-style:none;margin:0;padding:0 0 0 16px}
#list>ul{padding-left:0}
#drawer li button{font:inherit;color:var(--text);background:none;border:0;padding:4px 0;cursor:pointer;text-align:left;font-size:14px;line-height:1.3}
#drawer li button:hover,#drawer li button:focus-visible{color:var(--yellow)}
#drawer li button.hint{color:var(--hint);font-style:italic}
#drawer .btn{margin-top:12px}

#tip{position:fixed;right:20px;bottom:calc(env(safe-area-inset-bottom,0px) + 20px);margin:0;max-width:300px;text-align:right;font:500 11px/1.6 var(--mono);letter-spacing:.05em;text-transform:uppercase;color:var(--mut);transition:opacity .8s;pointer-events:none}
#tip.gone{opacity:0}
@media (max-width:720px){
  .top{padding-inline:12px}
  .crumbs{max-width:100%}
  .right{align-items:flex-start}
  #card{left:12px;right:12px;width:auto;bottom:calc(env(safe-area-inset-bottom,0px) + 12px);max-height:40vh}
  #tip{display:none}
  #drawer{left:12px;right:12px;width:auto;top:calc(env(safe-area-inset-top,0px) + 170px)}
  .lbl{font-size:12px}.lbl.k-page{font-size:17px}.lbl.k-root{font-size:22px}.lbl.k-note{font-size:15px}
}
@media (prefers-reduced-motion:reduce){.lbl,#tip{transition:none}}
</style>

<div id="stage" aria-hidden="true"></div>
<div id="labels"></div>
<header class="top">
  <div>
    <h1>Небо открытий</h1>
    <nav class="crumbs" id="crumbs" aria-label="Где вы сейчас"></nav>
  </div>
  <div class="variants" role="radiogroup" aria-label="Образ Толстого в центре">
    <button type="button" role="radio" data-variant="stars" aria-checked="true">Созвездие</button>
    <button type="button" role="radio" data-variant="medal" aria-checked="false">Медальон</button>
    <button type="button" role="radio" data-variant="lines" aria-checked="false">Линии</button>
  </div>
  <div class="right">
    <div class="counts">
      <span class="count"><b id="c-done">0</b>изучено</span>
      <span class="count h"><b id="c-found">0</b>намёков найдено</span>
    </div>
    <div class="ctrls">
      <button class="btn" type="button" id="b-home">Обзор</button>
      <button class="btn" type="button" id="b-back">Назад</button>
      <button class="btn" type="button" id="b-spin" aria-pressed="true">Вращение</button>
      <button class="btn" type="button" id="b-style" aria-pressed="false">Вид: значки</button>
      <button class="btn" type="button" id="b-list" aria-expanded="false" aria-controls="drawer">Список</button>
    </div>
  </div>
</header>
<aside id="card" aria-live="polite"></aside>
<aside id="drawer" hidden aria-label="Все звёзды списком">
  <h2>Все звёзды</h2>
  <div id="list"></div>
  <button class="btn" type="button" id="b-reveal">Раскрыть все намёки</button>
</aside>
<p id="tip">Тяните, чтобы вращать<br>Колесо или два пальца: приблизить<br>Нажмите на звезду, чтобы влететь</p>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
<script>
(() => {
  const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
  const RU1 = 'tolstoy/ten-frames.ru.html';
  const RU2 = 'tolstoy/gandhi-king.ru.html';
  // k: root | page | note | frame | hint;  s: done | hint;  a: anchor inside its presentation
  const DATA = [
    { id:'root', t:'Лев Толстой', k:'root', s:'done', y:'1828–1910', d:'Лев Николаевич Толстой в центре неба. Вокруг него две презентации и одна заметка из нашего чата.' },
    { id:'p1', p:'root', t:'Толстой в десяти кадрах', k:'page', s:'done', y:'1828–1910', url:RU1, d:'Первая презентация: жизнь Толстого и Россия его времени в 12 схемах.' },
    { id:'p2', p:'root', t:'Толстой, Ганди, Кинг', k:'page', s:'done', y:'1838–1968', url:RU2, d:'Вторая презентация: как «Царство Божие внутри вас» прошло через Ганди и дошло до Кинга.' },
    { id:'n1', p:'root', t:'Почему молчит школа', k:'note', s:'done', y:'наш чат', d:'Почему в русской школе не говорят о связи Толстого и Ганди. Ленин, толстовцы и неудобная для СССР идея.' },

    { id:'f1828', p:'p1', t:'Люди как собственность', k:'frame', s:'done', y:'1828', a:'s1828', d:'Крепостные: больше трети жителей европейской России принадлежали помещикам.' },
    { id:'f1847', p:'p1', t:'Проигранный дом', k:'frame', s:'done', y:'1847–1854', a:'s1847', d:'Казань, дневник на 63 года и дом, проданный за карточные долги.' },
    { id:'f1851', p:'p1', t:'Солдат и Севастополь', k:'frame', s:'done', y:'1851–1857', a:'s1851', d:'Кавказ, 349 дней осады Севастополя и гильотина в Париже.' },
    { id:'f1861', p:'p1', t:'Воля в кредит', k:'frame', s:'done', y:'1861', a:'s1861', d:'Отмена крепостного права и выкуп земли на 49 лет.' },
    { id:'f1862', p:'p1', t:'Софья', k:'frame', s:'done', y:'1862', a:'s1862', d:'Свадьба в 34 и 18 лет, 13 детей и черновики, переписанные по ночам.' },
    { id:'f1863', p:'p1', t:'«Война и мир» и Минар', k:'frame', s:'done', y:'1863–1869', a:'s1863', d:'Роман о 1812 годе и схема похода Наполеона, нарисованная в том же 1869 году.' },
    { id:'f1873', p:'p1', t:'«Анна Каренина» и поезд', k:'frame', s:'done', y:'1873–1877', a:'s1873', d:'«Все счастливые семьи похожи друг на друга» и железная дорога от первой линии до Астапова.' },
    { id:'f1879', p:'p1', t:'Всё есть, а жить незачем', k:'frame', s:'done', y:'1879–1882', a:'s1879', d:'Кризис в пятьдесят лет и «Исповедь».' },
    { id:'f1882', p:'p1', t:'Граф в крестьянских сапогах', k:'frame', s:'done', y:'1882–1908', a:'s1882', d:'Отказ от мяса, прав и церкви. «Два царя у нас: Николай Второй и Лев Толстой».' },
    { id:'f1910', p:'p1', t:'Последние десять дней', k:'frame', s:'done', y:'1910', a:'s1910', d:'Уход из дома, путь через Оптину пустынь и смерть на станции Астапово.' },
    { id:'fend', p:'p1', t:'Могила без имени', k:'frame', s:'done', y:'1910', a:'s-end', d:'Ни креста, ни камня: там, где, по легенде, зарыта зелёная палочка.' },

    { id:'g1', p:'p2', t:'Разорвать круг', k:'frame', s:'done', y:'1890–1893', a:'s-book', d:'«Не противься злому»: как выйти из круга насилия.' },
    { id:'g2', p:'p2', t:'На чём держится власть', k:'frame', s:'done', y:'1893', a:'s-state', d:'Власть держится на тех, кто ей служит. Схема с падающей плитой.' },
    { id:'g3', p:'p2', t:'Полка Ганди', k:'frame', s:'done', y:'1894', a:'s-gandhi', d:'Книга Толстого и трое, кто повлиял на Ганди сильнее всех.' },
    { id:'g4', p:'p2', t:'Семь писем', k:'frame', s:'done', y:'1908–1910', a:'s-letters', d:'«Письмо к индусу» и переписка Ганди с Толстым в его последний год.' },
    { id:'g5', p:'p2', t:'381 день пешком', k:'frame', s:'done', y:'1955–1956', a:'s-king', d:'Бойкот автобусов в Монтгомери, день за днём.' },
    { id:'g6', p:'p2', t:'Дух и метод', k:'frame', s:'done', y:'1959–1968', a:'s-nobel', d:'Нобелевская премия мира: у Толстого и Ганди её нет, у Кинга есть.' },

    { id:'h-diary', p:'f1847', t:'Дневники Толстого', k:'hint', s:'hint', y:'1847–1910', d:'Он вёл дневник с 18 лет до последней недели жизни. Что он туда записывал и зачем дал прочитать невесте?' },
    { id:'h-sofia', p:'f1862', t:'Дневники Софьи', k:'hint', s:'hint', y:'1862 и дальше', d:'Софья тоже вела дневник почти всю жизнь. Та же семья глазами другого человека.' },
    { id:'h-minard', p:'f1863', t:'Шарль Минар', k:'hint', s:'hint', y:'1869', d:'Отставной инженер нарисовал поход Наполеона одной картинкой. Почему её называют лучшей схемой в истории?' },
    { id:'h-dost', p:'f1873', t:'Толстой и Достоевский', k:'hint', s:'hint', y:'1878', d:'Два главных писателя России так ни разу и не встретились. Хотя однажды сидели на одной лекции.' },
    { id:'h-douk', p:'f1882', t:'Духоборы в Канаде', k:'hint', s:'hint', y:'1899', d:'7500 крестьян-пацифистов уплыли в Канаду на гонорар за «Воскресение». Что с ними стало потом?' },
    { id:'h-prok', p:'f1882', t:'Прокудин-Горский', k:'hint', s:'hint', y:'1908', d:'Фотограф, который снимал Российскую империю в цвете перед революцией. В 1908 году он приехал к Толстому.' },
    { id:'h-chert', p:'f1910', t:'Чертков и завещание', k:'hint', s:'hint', y:'1910', d:'Ученик, издатель и главный соперник Софьи. Тайное завещание, подписанное в лесу.' },
    { id:'h-garr', p:'g1', t:'Гаррисон и Балу', k:'hint', s:'hint', y:'1838', d:'Американцы, которые за полвека до Толстого сказали: не противься злу силой.' },
    { id:'h-thoreau', p:'g2', t:'Торо и неповиновение', k:'hint', s:'hint', y:'1849', d:'Американец, который отказался платить налог и провёл ночь в тюрьме. Его эссе читали Толстой, Ганди и Кинг.' },
    { id:'h-raich', p:'g3', t:'Райчандбхаи', k:'hint', s:'hint', y:'1867–1901', d:'Поэт-джайн и ювелир из Бомбея, почти ровесник Ганди. Ганди писал ему из Африки письма с вопросами о вере.' },
    { id:'h-ruskin', p:'g3', t:'Джон Рёскин', k:'hint', s:'hint', y:'1860', d:'Английский критик искусства. Его книга «Последнему, что и первому» за одну ночь в поезде изменила жизнь Ганди.' },
    { id:'h-das', p:'g4', t:'Таракнатх Дас', k:'hint', s:'hint', y:'1908', d:'Индийский революционер в Америке. Ему Толстой ответил «Письмом к индусу».' },
    { id:'h-kall', p:'g4', t:'Калленбах', k:'hint', s:'hint', y:'1910', d:'Архитектор из Йоханнесбурга родом из Германии. Отдал землю под «Ферму Толстого» и остался другом Ганди на всю жизнь.' },
    { id:'h-rustin', p:'g5', t:'Байярд Растин', k:'hint', s:'hint', y:'1956–1963', d:'Учил Кинга методам Ганди и стал главным организатором марша на Вашингтон.' },
    { id:'h-lenin', p:'n1', t:'Ленин о Толстом', k:'hint', s:'hint', y:'1908', d:'Статья «Лев Толстой как зеркало русской революции». По ней Толстого проходили в советской школе.' },
    { id:'h-tolst', p:'n1', t:'Толстовцы в СССР', k:'hint', s:'hint', y:'1920–1930-е', d:'Коммуны последователей Толстого: как они жили при Советах и что с ними стало в 1930-е.' }
  ];
  const byId = {};
  DATA.forEach(n => { n.kids = []; byId[n.id] = n; });
  DATA.forEach(n => { if (n.p) byId[n.p].kids.push(n); });
  const HINTS = DATA.filter(n => n.s === 'hint');

  const $ = id => document.getElementById(id);
  const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;' }[c]));
  const plural = (n, a, b, c) => { const m = n % 10, h = n % 100; return m === 1 && h !== 11 ? a : m >= 2 && m <= 4 && (h < 12 || h > 14) ? b : c; };
  const trail = n => { const t = []; for (let p = n.p && byId[n.p]; p; p = p.p && byId[p.p]) t.unshift(p); return t; };
  const pageOf = n => { let p = n; while (p && p.k !== 'page') p = p.p && byId[p.p]; return p; };

    hintKids(par).forEach(h => { if (!h.revT0) h.revT0 = now + (reduce ? 0 : 350 + (i++) * 170); });
  };
  $('b-reveal').addEventListener('click', () => { DATA.forEach(n => hintKids(n).length && reveal(n)); renderCard(); });

  // Prezi-like flight: arc outward on the way, then settle close to the target
  const DIST = { root: 125, page: 30, note: 26, frame: 12, hint: 8 };
  let fly = null;
  const flyTo = (target, dist) => {
    const fromP = camera.position.clone(), fromT = controls.target.clone();
    const dir = fromP.clone().sub(fromT);
    if (dir.lengthSq() < 1e-4) dir.set(0, .35, 1);
    dir.normalize(); dir.y = Math.max(dir.y, .18); dir.normalize();
    fly = { fromP, fromT, toT: target.clone(), toP: target.clone().addScaledVector(dir, dist), hop: Math.min(fromT.distanceTo(target) * .45, 60), t0: performance.now(), dur: reduce ? 1 : 1300 };
    controls.enabled = false;
  };
  const tmpP = V(0, 0, 0), tmpT = V(0, 0, 0), out = V(0, 0, 0);
  const stepFly = now => {
    if (!fly) return;
    const k = Math.min(1, (now - fly.t0) / fly.dur), e = k < .5 ? 4 * k * k * k : 1 - Math.pow(-2 * k + 2, 3) / 2;
    tmpT.lerpVectors(fly.fromT, fly.toT, e);
    tmpP.lerpVectors(fly.fromP, fly.toP, e);
    out.copy(tmpP).sub(tmpT).normalize().multiplyScalar(fly.hop * Math.sin(Math.PI * e));
    camera.position.copy(tmpP).add(out);
    controls.target.copy(tmpT);
    if (k === 1) { fly = null; controls.enabled = true; }
  };

  focusFn = id => {
    const n = byId[id];
    sel = id;
    setPath();
    if (hintKids(n).length) reveal(n);
    if (n.s === 'hint') reveal(byId[n.p]);
    controls.minDistance = id === 'root' ? 30 : n.R * (style === 'badges' ? 3.4 : 2.8);
    flyTo(n.pos, DIST[n.k]);
    renderCard();
  };

  const easeOutBack = k => 1 + 2.4 * Math.pow(k - 1, 3) + 1.4 * Math.pow(k - 1, 2);
  const stepReveal = (now, t) => HINTS.forEach(h => {
    const k = h.revT0 ? Math.min(1, Math.max(0, (now - h.revT0) / 900)) : 0;
    if (k !== h.rev) {
      h.rev = k;
      h.cur.lerpVectors(h.bud, h.pos, k ? easeOutBack(k) : 0);
      h.obj.position.copy(h.cur);
      h.core.scale.setScalar(.4 + .6 * k);
      h.core.material.opacity = .3 + .6 * k;
      h.badge.material.opacity = .35 + .65 * k;
      const u = h.flow.material.uniforms;
      u.uB.value.copy(h.cur); u.uC.value.copy(bend(h.flowA, h.cur, h.flowI)); u.uOpacity.value = .8 * k;
    }
    h.core.rotation.x = t * .3 + h.phase; h.core.rotation.y = t * .45;
    h.glow.material.uniforms.uOpacity.value = (.25 + .6 * h.rev) * (reduce ? 1 : .7 + .3 * Math.sin(t * 2.3 + h.phase));
  });

  // labels sit just outside the body's edge on screen, and hide when the body fills the view
  const proj = V(0, 0, 0);
  const stepLabels = () => {
    const w = stage.clientWidth, h = stage.clientHeight, grp = groupOf(byId[sel]);
    const k = (h / 2) / Math.tan(camera.fov * Math.PI / 360);
    for (const n of DATA) {
      const el = n.el;
      proj.copy(n.cur).project(camera);
      const d = camera.position.distanceTo(n.cur), rpx = n.R / d * k;
      let show = proj.z < 1 && proj.z > -1 && rpx < h * .3;
      if (show && n.k === 'frame') show = grp === n.p || d < 42 || sel === n.id;
      if (show && n.s === 'hint') show = n.rev > .55;
      if (!show) { el.classList.add('off'); continue; }
      el.classList.remove('off');
      const x = (proj.x + 1) / 2 * w, y = (1 - proj.y) / 2 * h;
      const far = n.k === 'frame' || n.s === 'hint' ? d / 85 : d / 300;
      el.style.opacity = Math.max(.35, Math.min(1, 1.35 - far)).toFixed(2);
      el.style.transform = n.k === 'root'
        ? `translate(${x.toFixed(1)}px,${(y + rpx * 1.25 + 14).toFixed(1)}px) translateX(-50%)`
        : `translate(${(x + rpx * 1.1 + 8).toFixed(1)}px,${y.toFixed(1)}px) translateY(-50%)`;
    }
  };

  // click vs drag, hover
  const ray = new THREE.Raycaster(), ptr = new THREE.Vector2();
  const pick = e => {
    const r = renderer.domElement.getBoundingClientRect();
    ptr.set((e.clientX - r.left) / r.width * 2 - 1, -((e.clientY - r.top) / r.height) * 2 + 1);
    ray.setFromCamera(ptr, camera);
    const hit = ray.intersectObjects(pickables, false).find(x => { const n = byId[x.object.userData.id]; return n.s !== 'hint' || n.rev > .5; });
    return hit ? hit.object.userData.id : null;
  };
  let down = null;
  const acted = () => { $('tip').classList.add('gone'); };
  renderer.domElement.addEventListener('pointerdown', e => { down = { x: e.clientX, y: e.clientY, t: performance.now() }; acted(); });
  renderer.domElement.addEventListener('pointerup', e => {
    if (down && Math.hypot(e.clientX - down.x, e.clientY - down.y) < 6 && performance.now() - down.t < 600) { const id = pick(e); if (id) focusFn(id); }
    down = null;
  });
  renderer.domElement.addEventListener('pointermove', e => {
    if (e.buttons) return;
    const id = pick(e);
    if (id === hover) return;
    if (hover) byId[hover].el.classList.remove('hov');
    hover = id;
    if (id) byId[id].el.classList.add('hov');
    renderer.domElement.style.cursor = id ? 'pointer' : 'grab';
  });
  renderer.domElement.addEventListener('wheel', acted, { passive: true });

  $('b-spin').setAttribute('aria-pressed', String(spinOn));
  $('b-spin').addEventListener('click', () => { spinOn = !spinOn; $('b-spin').setAttribute('aria-pressed', String(spinOn)); });

  const t0 = performance.now();
  const tick = now => {
    requestAnimationFrame(tick);
    const t = (now - t0) / 1000;
    TIME.value = reduce ? 0 : t;
    stepFly(now);
    stepReveal(now, t);
    VAR[variant].step(now, t);
    controls.autoRotate = spinOn && !fly;
    controls.update();
    billboards.forEach(b => b.quaternion.copy(camera.quaternion));
    facing.forEach(f => f.quaternion.slerp(camera.quaternion, .04));
    DATA.forEach(n => {
      if (n.k === 'root') return;
      if (n.spin) n.spin.rotation.z = t * .08;
      if (n.core.isMesh && n.k !== 'frame') n.core.rotation.y = t * .05;
      if (n.s !== 'hint') n.glow.material.uniforms.uStrength.value = n.base * (hover === n.id ? 1.6 : 1);
      const grow = hover === n.id ? 1.15 : 1, reveal = n.s === 'hint' ? .35 + .65 * Math.max(0, n.rev) : 1;
      n.badge.scale.setScalar(BR[n.k] * 2 * grow * reveal);
      n.badge.position.y = reduce ? 0 : Math.sin(t * 1.1 + n.phase) * .12;
    });
    belt.rotation.y = t * .01;
    const s = byId[sel];
    selRing.visible = sel !== 'root';
    selRing.position.copy(s.cur);
    selRing.quaternion.copy(camera.quaternion);
    selRing.rotateZ(t * .4);
    selRing.scale.setScalar(s.R * (style === 'badges' ? 1.35 : 2.4) * (1 + (reduce ? 0 : .04 * Math.sin(t * 3))));
    stepLabels();
    renderer.render(scene, camera);
  };
  applyStyle();
  setVariant('stars');
  focusFn('root');
  requestAnimationFrame(tick);
  setTimeout(acted, 12000);
  };
  renderCard();
  Promise.race([document.fonts ? document.fonts.ready : Promise.resolve(), new Promise(r => setTimeout(r, 1500))]).then(init3D);
})();
</script>
