<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>[hidden]{display:none!important}</style>
<title>Небо открытий</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fira+Sans+Extra+Condensed:wght@600;700;800;900&family=IBM+Plex+Mono:wght@400;500;600&family=PT+Serif:ital,wght@0,400;0,700;1,400&display=swap">
<style>
/* one deliberate night look: the page is a sky */
:root{
  --bg:#0B0D14; --panel:rgba(15,18,26,.84); --line:rgba(255,255,255,.14);
  --text:#EDEBE5; --mut:#8E96A8; --yellow:#FFD812; --red:#FF5E42; --hint:#9AA3B5; --note:#BFD4FF;
  --display:"Fira Sans Extra Condensed","Arial Narrow",Arial,sans-serif;
  --serif:"PT Serif",Georgia,"Times New Roman",serif;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
  color-scheme:dark;
}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--text);font:400 16px/1.5 var(--serif);overflow:hidden;-webkit-font-smoothing:antialiased}
#stage{position:fixed;inset:0}
#stage canvas{display:block;width:100%;height:100%;touch-action:none;cursor:grab}
#stage canvas:active{cursor:grabbing}

#labels{position:fixed;inset:0;pointer-events:none;overflow:hidden}
.lbl{position:absolute;left:0;top:0;pointer-events:auto;background:none;border:0;margin:0;padding:3px 6px;color:var(--text);font:400 14px/1.15 var(--serif);white-space:nowrap;cursor:pointer;text-align:left;text-shadow:0 1px 8px #000,0 0 3px #000;transition:opacity .3s,filter .25s,color .2s}
.ck{display:inline-block;width:14px;height:14px;margin-right:6px;border-radius:50%;background:var(--c,var(--yellow));color:#161616;font:700 9px/14px var(--mono);font-style:normal;text-align:center;vertical-align:1px;text-shadow:none}
.ck.q{background:none;border:1px dashed var(--c,var(--hint));color:var(--c,var(--hint));line-height:12px;width:12px;height:12px}
.lbl.k-root{font:900 28px/1 var(--display);text-transform:uppercase;letter-spacing:.02em;color:#FFF1B0}
.lbl.k-root .ck{display:none}
.lbl.k-page{font:800 21px/1 var(--display);text-transform:uppercase;letter-spacing:.02em}
.lbl.k-note{font:700 18px/1 var(--display);text-transform:uppercase;color:var(--note)}
.lbl.k-note .ck{background:var(--note)}
.lbl small{display:block;margin:4px 0 0 20px;font:500 10px/1.2 var(--mono);letter-spacing:.08em;color:var(--mut)}
.bud{display:inline-block;margin-left:8px;padding:3px 6px;border:1px solid var(--c,var(--hint));border-radius:999px;font:600 10px/1 var(--mono);font-style:normal;color:var(--c,var(--hint));vertical-align:2px;text-shadow:none;animation:ping 2.2s ease-out infinite}
@keyframes ping{0%{box-shadow:0 0 0 0 var(--c,var(--hint))}100%{box-shadow:0 0 0 10px rgba(0,0,0,0)}}
.bud[hidden]{display:none}
.lbl.hint{white-space:normal;width:max-content;max-width:210px;line-height:1.25;color:var(--text);font-style:italic;text-shadow:0 0 14px var(--c),0 1px 8px #000}
.lbl.hint small{color:var(--c);font-style:normal}
.lbl.hint .ck.q{animation:ping 2.2s ease-out infinite}
.lbl.dim{opacity:.22!important}
.lbl.sel{color:var(--c,var(--yellow))}
.lbl.k-root.sel{color:#FFF1B0}
.lbl.hov{text-decoration:underline;text-underline-offset:4px}
.lbl.off{opacity:0!important;pointer-events:none}
.lbl:focus-visible{outline:2px solid var(--yellow);outline-offset:2px}

.top{position:fixed;left:0;right:0;top:0;padding:calc(env(safe-area-inset-top,0px) + 16px) 20px 0;display:flex;justify-content:space-between;align-items:flex-start;gap:12px 16px;flex-wrap:wrap;pointer-events:none}
.top>*{pointer-events:auto}
h1{margin:0;font:900 clamp(30px,4vw,46px)/.9 var(--display);text-transform:uppercase;letter-spacing:.01em}
.crumbs{display:flex;flex-wrap:wrap;align-items:center;gap:4px 6px;margin-top:8px;max-width:60vw;font:500 11px/1.3 var(--mono);letter-spacing:.06em;text-transform:uppercase;color:var(--mut)}
.crumbs button{font:inherit;letter-spacing:inherit;text-transform:inherit;color:var(--mut);background:none;border:0;padding:2px 0;cursor:pointer}
.crumbs button:hover,.crumbs button:focus-visible{color:var(--yellow)}
.crumbs .here{color:var(--text)}
.crumbs i{font-style:normal;opacity:.5}
.right{display:flex;flex-direction:column;align-items:flex-end;gap:10px}
.counts{display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end}
.count{padding:6px 10px;border:1px solid var(--line);background:var(--panel);backdrop-filter:blur(8px);font:500 11px/1.2 var(--mono);letter-spacing:.06em;text-transform:uppercase;color:var(--mut)}
.count b{font:900 20px/1 var(--display);color:var(--yellow);margin-right:6px;vertical-align:-2px;font-variant-numeric:tabular-nums}
.count.h b{color:var(--hint)}
.ctrls{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
.cats{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
.cat{display:inline-flex;align-items:center;gap:6px;font:500 11px/1 var(--mono);letter-spacing:.04em;color:var(--text);background:var(--panel);border:1px solid var(--line);border-radius:999px;padding:6px 10px;cursor:pointer;backdrop-filter:blur(8px)}
.cat i{width:9px;height:9px;border-radius:50%;background:var(--c)}
.cat:hover,.cat[aria-pressed="true"]{border-color:var(--c)}
.cat[aria-pressed="true"]{box-shadow:inset 0 0 0 1px var(--c)}
.cat:focus-visible{outline:2px solid var(--c);outline-offset:2px}
.btn{font:500 11px/1 var(--mono);letter-spacing:.06em;text-transform:uppercase;color:var(--text);background:var(--panel);border:1px solid var(--line);border-radius:999px;padding:8px 12px;cursor:pointer;backdrop-filter:blur(8px);text-decoration:none;display:inline-block}
.btn:hover{border-color:var(--yellow);color:var(--yellow)}
.btn[aria-pressed="true"],.btn[aria-expanded="true"]{border-color:var(--yellow)}
.btn.primary{background:var(--yellow);color:#161616;border-color:var(--yellow);padding:10px 14px}
.btn.primary:hover{background:#FFFFFF;color:#161616}
.btn:focus-visible{outline:2px solid var(--yellow);outline-offset:2px}

#card{position:fixed;padding-right:40px!important;left:20px;bottom:calc(env(safe-area-inset-bottom,0px) + 20px);width:min(360px,calc(100% - 40px));max-height:min(54vh,540px);overflow:auto;background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:16px 18px 18px;backdrop-filter:blur(12px)}
.x{position:absolute;top:8px;right:8px;width:28px;height:28px;border-radius:50%;border:1px solid var(--line);background:none;color:var(--mut);font:400 18px/1 var(--mono);cursor:pointer}
.x:hover,.x:focus-visible{color:var(--text);border-color:var(--text);outline:none}
body.mm .lbl{font-size:12px}
body.mm .lbl.hint{font-size:11.5px;max-width:160px}
body.mm .lbl.k-page{font-size:17px}
body.mm .lbl.k-note{font-size:15px}
body.mm .lbl.k-root{font-size:22px}
body.mm .bud{display:none}
body.mm .lbl.hint .qq{display:none}
body.mm .lbl.hint small{display:inline;margin:0;font:italic 400 12px/1.2 var(--serif);letter-spacing:0;text-transform:none;color:var(--text)}
body.mm .lbl.hint:hover,body.mm .lbl.hint.sel{z-index:2}
body.mm .lbl.hint:hover .qq,body.mm .lbl.hint.sel .qq{display:block;margin-bottom:2px;color:var(--c)}
.lbl.left{text-align:right}
.lbl.left small{margin:4px 0 0}
.chip{display:inline-block;font:600 10px/1 var(--mono);letter-spacing:.08em;text-transform:uppercase;padding:5px 8px 4px;border:1px solid var(--line);color:var(--text)}
.chip.hint{border-style:dashed;border-color:var(--hint);color:var(--hint)}
.chip.page,.chip.root{background:var(--yellow);border-color:var(--yellow);color:#161616}
.chip.note{border-color:var(--note);color:var(--note)}
#card h2{margin:10px 0 4px;font:800 32px/.95 var(--display);text-wrap:balance}
.yr{font:500 11px/1.3 var(--mono);color:var(--mut);letter-spacing:.06em}
.d{margin:10px 0 0;font-size:15px;line-height:1.5}
.small{margin:10px 0 0;font-size:13px;line-height:1.45;color:var(--mut)}
.actions{display:flex;flex-direction:column;align-items:flex-start;gap:10px;margin-top:14px}
.actions:empty{display:none}
pre{white-space:pre-wrap;margin:0;font:400 12px/1.45 var(--mono);color:var(--text);background:rgba(255,255,255,.04);border:1px dashed var(--hint);padding:10px;user-select:all;width:100%;box-sizing:border-box}
.hookline{margin:8px 0 0;font:italic 400 17px/1.35 var(--serif);color:var(--c,var(--text))}
.hooks{display:flex;flex-direction:column;gap:6px;margin-top:14px}
.hooks .label{margin:0 0 2px;font:600 10px/1.2 var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--mut)}
.hook{display:flex;align-items:flex-start;gap:10px;text-align:left;color:var(--text);background:rgba(255,255,255,.03);border:1px solid var(--line);border-radius:6px;padding:8px 10px;cursor:pointer}
.hook:hover,.hook:focus-visible{border-color:var(--c);outline:none}
.hook .q{flex:none;width:18px;height:18px;border-radius:50%;border:1px dashed var(--c);color:var(--c);font:700 11px/16px var(--mono);text-align:center;animation:ping 2.2s ease-out infinite}
.hook b{display:block;font:italic 400 14px/1.3 var(--serif)}
.hook small{display:block;margin-top:2px;font:500 10px/1.2 var(--mono);letter-spacing:.06em;text-transform:uppercase;color:var(--c)}
.toast{color:var(--yellow);font:600 11px var(--mono);letter-spacing:.06em;text-transform:uppercase}

#drawer{position:fixed;right:20px;top:calc(env(safe-area-inset-top,0px) + 170px);bottom:calc(env(safe-area-inset-bottom,0px) + 20px);width:min(320px,calc(100% - 40px));overflow:auto;background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:14px 16px 16px;backdrop-filter:blur(12px)}
#drawer h2{margin:0 0 10px;font:800 22px/1 var(--display);text-transform:uppercase}
#drawer ul{list-style:none;margin:0;padding:0 0 0 16px}
#list>ul{padding-left:0}
#drawer li button{font:inherit;color:var(--text);background:none;border:0;padding:4px 0;cursor:pointer;text-align:left;font-size:14px;line-height:1.3}
#drawer li button:hover,#drawer li button:focus-visible{color:var(--yellow)}
#drawer li button.hint{color:var(--hint);font-style:italic}
#drawer .btn{margin-top:12px}

.btn.film{background:var(--yellow);color:#161616;border-color:var(--yellow);font-weight:600}
.btn.film:hover{background:#FFFFFF;color:#161616;border-color:#FFFFFF}
#cine{position:fixed;inset:0;pointer-events:none;z-index:30}
#cine .bar{position:absolute;left:0;right:0;height:11vh;background:#000;transition:transform .9s cubic-bezier(.6,0,.2,1)}
#cine .bar.top{top:0;transform:translateY(-100%)}
#cine .bar.bottom{bottom:0;transform:translateY(100%)}
#cine.on .bar{transform:none}
.cine-year{position:absolute;left:clamp(16px,4vw,48px);top:calc(11vh + 14px);font:900 clamp(56px,11vw,150px)/.85 var(--display);color:var(--yellow);font-variant-numeric:tabular-nums;opacity:0;transition:opacity 1s .4s;text-shadow:0 0 40px rgba(255,216,18,.35)}
#cine.on .cine-year{opacity:.92}
.cine-cap{position:absolute;left:50%;bottom:calc(11vh + 26px);width:min(820px,calc(100% - 32px));margin:0;transform:translate(-50%,12px);text-align:center;font:italic 400 clamp(19px,2.3vw,28px)/1.35 var(--serif);color:#FFFDF6;text-shadow:0 2px 18px #000,0 0 3px #000;opacity:0;transition:opacity .7s,transform .7s}
.cine-cap.on{opacity:1;transform:translate(-50%,0)}
.cine-prog{position:absolute;left:0;right:0;bottom:11vh;height:2px;background:rgba(255,255,255,.08)}
.cine-prog i{display:block;height:100%;width:0;background:var(--yellow)}
.cine-ctrls{position:absolute;right:clamp(16px,4vw,48px);top:calc(11vh + 14px);display:flex;gap:6px;pointer-events:auto;opacity:0;transition:opacity .8s .6s}
#cine.on .cine-ctrls{opacity:1}
.top,#card,#drawer{transition:opacity .6s}
body.cine .top,body.cine #card,body.cine #drawer,body.cine #tip{opacity:0;pointer-events:none}
body.cine .lbl{pointer-events:none}
body.cine #labels{opacity:.8}
#ask{position:fixed;left:calc(50% + 190px);transform:translateX(-50%);bottom:calc(env(safe-area-inset-bottom,0px) + 20px);width:min(560px,calc(100% - 440px));display:flex;flex-direction:column;gap:8px;z-index:20;margin:0;transition:opacity .6s}
.ask-row{display:flex;gap:6px;padding:6px;background:var(--panel);border:1px solid var(--line);border-radius:999px;backdrop-filter:blur(12px)}
.ask-row:focus-within{border-color:var(--yellow)}
.ask-row input{flex:1;min-width:0;background:none;border:0;color:var(--text);font:400 15px/1.2 var(--serif);padding:8px 12px;outline:none}
.ask-row input::placeholder{color:var(--mut)}
.ask-mark{align-self:center;margin-left:8px;font:700 14px/1 var(--mono);background:linear-gradient(90deg,#F2B84B,#F08A7E,#7FA7E0,#5CC8A8);-webkit-background-clip:text;background-clip:text;color:transparent}
#ask-out{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:12px 14px;backdrop-filter:blur(12px);max-height:32vh;overflow:auto}
#ask-text{margin:0;font:400 15px/1.5 var(--serif)}
#ask-nodes{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
#ask-nodes:empty{display:none}
.nchip{font:500 11px/1 var(--mono);letter-spacing:.04em;color:var(--text);background:none;border:1px solid var(--c,var(--line));border-radius:999px;padding:6px 9px;cursor:pointer}
.nchip:hover{background:rgba(255,255,255,.06)}
.nchip.new{border-style:dashed}
body.cine #ask{opacity:0;pointer-events:none}
.facts{margin:10px 0 0;padding-left:18px;font-size:14px;line-height:1.45}
.facts li{margin:4px 0}
.btn.grow,.chip.grown{background:linear-gradient(90deg,#F2B84B,#F08A7E,#7FA7E0,#5CC8A8);color:#161616;border-color:transparent}
.btn.grow:hover{filter:brightness(1.12);color:#161616}
.growing{display:flex;align-items:center;gap:8px;margin:0;font:italic 400 14px/1.4 var(--serif);color:var(--text)}
.spin{flex:none;width:14px;height:14px;border-radius:50%;border:2px solid var(--line);border-top-color:var(--yellow);animation:spin 1s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.err{color:#FF8A7A}
@media (max-width:720px){#ask{left:12px;right:12px;width:auto;transform:none;bottom:calc(40vh + 24px)}}
#tip{position:fixed;right:20px;bottom:calc(env(safe-area-inset-bottom,0px) + 90px);margin:0;max-width:300px;text-align:right;font:500 11px/1.6 var(--mono);letter-spacing:.05em;text-transform:uppercase;color:var(--mut);transition:opacity .8s;pointer-events:none}
#tip.gone{opacity:0}
@media (max-width:720px){
  .top{padding-inline:12px}
  .crumbs{max-width:100%}
  .right{align-items:flex-start}
  #card{left:12px;right:12px;width:auto;bottom:calc(env(safe-area-inset-bottom,0px) + 12px);max-height:40vh}
  #tip{display:none}
  #drawer{left:12px;right:12px;width:auto;top:calc(env(safe-area-inset-top,0px) + 170px)}
  .lbl{font-size:12px}.lbl.k-page{font-size:17px}.lbl.k-root{font-size:22px}.lbl.k-note{font-size:15px}
}
@media (prefers-reduced-motion:reduce){.lbl,#tip{transition:none}.bud,.ck.q,.hook .q{animation:none}}
</style>

<div id="stage" aria-hidden="true"></div>
<div id="labels"></div>
<header class="top">
  <div>
    <h1>Небо открытий</h1>
    <nav class="crumbs" id="crumbs" aria-label="Где вы сейчас"></nav>
  </div>
  <div class="right">
    <div class="counts">
      <span class="count"><b id="c-done">0</b>изучено</span>
      <span class="count h"><b id="c-found">0</b>намёков найдено</span>
    </div>
    <div class="ctrls">
      <button class="btn film" type="button" id="b-film">▶ Фильм</button>
      <button class="btn" type="button" id="b-mind" aria-pressed="false">Майнд-мап</button>
      <button class="btn" type="button" id="b-home">Обзор</button>
      <button class="btn" type="button" id="b-back">Назад</button>
      <button class="btn" type="button" id="b-spin" aria-pressed="true">Вращение</button>
      <button class="btn" type="button" id="b-style" aria-pressed="false">Вид: значки</button>
      <button class="btn" type="button" id="b-list" aria-expanded="false" aria-controls="drawer">Список</button>
    </div>
    <div class="cats" id="cats" role="group" aria-label="Цвета веток: нажмите, чтобы выделить"></div>
  </div>
</header>
<aside id="card" aria-live="polite"></aside>
<form id="ask" hidden autocomplete="off">
  <div id="ask-out" hidden aria-live="polite"><p id="ask-text"></p><div id="ask-nodes"></div></div>
  <div class="ask-row"><span class="ask-mark" aria-hidden="true">✦</span><input id="ask-q" type="text" maxlength="200" placeholder="Спросите небо: кто повлиял на Ганди?" aria-label="Вопрос небу"><button class="btn primary" type="submit" id="ask-go">Спросить</button></div>
</form>
<div id="cine" hidden aria-live="polite">
  <div class="bar top"></div><div class="bar bottom"></div>
  <div class="cine-year" id="cine-year" aria-hidden="true">1828</div>
  <div class="cine-ctrls">
    <button class="btn" type="button" id="cine-sound" aria-pressed="true">Музыка</button>
    <button class="btn" type="button" id="cine-voice" aria-pressed="true">Голос</button>
    <button class="btn" type="button" id="cine-exit">✕ Выйти</button>
  </div>
  <p class="cine-cap" id="cine-cap"></p>
  <div class="cine-prog"><i id="cine-prog"></i></div>
</div>
<aside id="drawer" hidden aria-label="Все звёзды списком">
  <h2>Все звёзды</h2>
  <div id="list"></div>
  <button class="btn" type="button" id="b-reveal">Раскрыть все намёки</button>
</aside>
<p id="tip">Тяните, чтобы вращать<br>Колесо или два пальца: приблизить<br>Нажмите на звезду, чтобы влететь</p>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
<script>
(() => {
  const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
  const RU1 = 'tolstoy/ten-frames.ru.html';
  const RU2 = 'tolstoy/gandhi-king.ru.html';
  // k: root | page | note | frame | hint;  s: done | hint;  a: anchor inside its presentation
  const DATA = [
    { id:'root', t:'Лев Толстой', k:'root', s:'done', y:'1828–1910', d:'Лев Николаевич Толстой в центре неба. Вокруг него две презентации и одна заметка из нашего чата.' },
    { id:'p1', p:'root', t:'Толстой в десяти кадрах', k:'page', s:'done', y:'1828–1910', url:RU1, d:'Первая презентация: жизнь Толстого и Россия его времени в 12 схемах.' },
    { id:'p2', p:'root', t:'Толстой, Ганди, Кинг', k:'page', s:'done', y:'1838–1968', url:RU2, d:'Вторая презентация: как «Царство Божие внутри вас» прошло через Ганди и дошло до Кинга.' },
    { id:'n1', p:'root', t:'Почему молчит школа', k:'note', s:'done', y:'наш чат', d:'Почему в русской школе не говорят о связи Толстого и Ганди. Ленин, толстовцы и неудобная для СССР идея.' },

    { id:'f1828', p:'p1', t:'Люди как собственность', k:'frame', s:'done', y:'1828', a:'s1828', d:'Крепостные: больше трети жителей европейской России принадлежали помещикам.' },
    { id:'f1847', p:'p1', t:'Проигранный дом', k:'frame', s:'done', y:'1847–1854', a:'s1847', d:'Казань, дневник на 63 года и дом, проданный за карточные долги.' },
    { id:'f1851', p:'p1', t:'Солдат и Севастополь', k:'frame', s:'done', y:'1851–1857', a:'s1851', d:'Кавказ, 349 дней осады Севастополя и гильотина в Париже.' },
    { id:'f1861', p:'p1', t:'Воля в кредит', k:'frame', s:'done', y:'1861', a:'s1861', d:'Отмена крепостного права и выкуп земли на 49 лет.' },

  /* light flows: curved ribbons with pulses running outward from Tolstoy, continuous across junctions */
  const FLOW = { spacing: '20.0', speed: '4.2' };
  const flowGeo = (() => {
    const N = 64, t = new Float32Array((N + 1) * 2), side = new Float32Array((N + 1) * 2), idx = [];
    for (let i = 0; i <= N; i++) {
      t[i * 2] = t[i * 2 + 1] = i / N; side[i * 2] = -1; side[i * 2 + 1] = 1;
      if (i < N) idx.push(i * 2, i * 2 + 1, i * 2 + 2, i * 2 + 1, i * 2 + 3, i * 2 + 2);

    g.setAttribute('position', new THREE.BufferAttribute(new Float32Array((N + 1) * 6), 3));

  })();
  const flowMat = (color, width, hint) => new THREE.ShaderMaterial({
    uniforms: { uTime: TIME, uA: { value: V(0, 0, 0) }, uB: { value: V(0, 0, 0) }, uC: { value: V(0, 0, 0) }, uWidth: { value: width }, uColor: { value: col3(color) }, uOffset: { value: 0 }, uLen: { value: 1 }, uOpacity: { value: 1 }, uBoost: { value: 1 }, uHint: { value: hint ? 1 : 0 } },
    vertexShader: `attribute float aT; attribute float aSide; uniform vec3 uA; uniform vec3 uB; uniform vec3 uC; uniform float uWidth; varying float vT; varying float vS;
      void main(){
        float t=aT; vec3 p=mix(mix(uA,uC,t),mix(uC,uB,t),t);

  const makeFlow = n => {

  // the way from Tolstoy to the chosen node shines brighter
  const setPath = () => {
    const on = new Set(trail(byId[sel]).map(p => p.id).concat(sel));

  };

  const pings = [];
  const makePing = n => {
    if (n.ping || (n.s !== 'hint' && !hintKids(n).length)) return;

  DATA.forEach(makePing);

  // Вид: значки (clear pictograms) or звёзды (the first sky)
  let style = 'badges';
  const radius = n => n.k === 'root' ? 13 : style === 'badges' ? BR[n.k] : SIZE[n.k];
  const applyStyle = () => {
    DATA.forEach(n => { if (n.badge) { n.badge.visible = style === 'badges'; n.star.visible = style === 'stars'; } n.R = radius(n); });

    $('b-style').setAttribute('aria-pressed', String(style === 'stars'));

  };
  $('b-style').addEventListener('click', () => { style = style === 'badges' ? 'stars' : 'badges'; applyStyle(); });

  // selection: a dashed ring built from real geometry, so it stays crisp up close
  const selRing = new THREE.Group();
  {
    const m = new THREE.MeshBasicMaterial({ color: 0xFF7A5C, transparent: true, opacity: .7, side: THREE.DoubleSide, depthWrite: false });
    for (let i = 0; i < 36; i++) selRing.add(new THREE.Mesh(new THREE.RingGeometry(1, 1.022, 8, 1, i / 36 * Math.PI * 2, Math.PI * 2 / 36 * .5), m));

  };
  $('b-reveal').addEventListener('click', () => { DATA.forEach(n => hintKids(n).length && reveal(n)); renderCard(); });

  /* Майнд-мап: the same nodes laid flat, Tolstoy in the middle, branches to both sides */
  const MMX = [0, 26, 56, 96], ROW = 7.5, mmx = d => d < 4 ? MMX[d] : 96 + (d - 3) * 40;
  byId.root.mm = V(0, 0, 0);
  const mmSide = (ids, side) => {
    let row = 0;
    const walk = (n, d) => {
      if (!n.kids.length) { n.mm = V(side * mmx(d), -(row++) * ROW, 0); return; }
      n.kids.forEach(k => walk(k, d + 1));
      const ys = n.kids.map(k => k.mm.y);

    };

  const layoutMM = () => { mmSide(['p1'], -1); mmSide(['p2', 'n1'], 1); };
  layoutMM();
  let mmOn = false, mmE = 0, mmFrom = 0, mmTo = 0, mmT0 = 0;
  let showE = 0, showTo = 0, cine = null; // showE: the film's finale opens every hint for a moment
  const vis = n => n.s === 'hint' ? Math.max(n.rev, mmE, showE) : 1; // in the flat map every hint is shown
  const easeIO = k => k < .5 ? 4 * k * k * k : 1 - Math.pow(-2 * k + 2, 3) / 2;
  const sp = V(0, 0, 0), fa = V(0, 0, 0), fc = V(0, 0, 0);
  const stepLayout = e => DATA.forEach(n => {
    if (n.k === 'root') return;
    const r = n.s === 'hint' ? Math.max(n.rev, showE) : 0;
    if (n.s === 'hint') sp.lerpVectors(n.bud, n.pos, r > 0 ? easeOutBack(r) : 0); else sp.copy(n.pos);

    if (par.k === 'root') fa.copy(n.cur).normalize().multiplyScalar(12 * (1 - .45 * e)); else fa.copy(par.cur);

    u.uA.value.copy(fa); u.uB.value.copy(n.cur); u.uC.value.copy(fc);

  const DIST = { root: 125, page: 30, note: 26, frame: 12, hint: 8 };

  /* ---------- Фильм: a guided flight through the whole story, with captions, music and a voice ---------- */
  const SHOTS = [

  const FLIGHT = 2600, holdOf = sh => Math.max(4500, sh.text.length / 13 * 1000);
  const TOTAL = SHOTS.reduce((a, sh) => a + FLIGHT + holdOf(sh), 0);
  const capEl = $('cine-cap'), yearEl = $('cine-year'), progEl = $('cine-prog');

  // music written on the fly: a slow Am–F–Cmaj7–G pad in a big reverb, and a bell on every arrival
  const music = (() => {
    let C = null, master = null, bus = null, timer = null, muted = false, step = 0;
    const hz = m => 440 * Math.pow(2, (m - 69) / 12);
    const CHORDS = [[45, 57, 60, 64], [41, 53, 57, 60], [36, 48, 52, 55, 59], [43, 55, 59, 62]];
    const voice = (f, t, dur, type, gain) => {
      const o = C.createOscillator(), g = C.createGain(), lp = C.createBiquadFilter();
      o.type = type; o.frequency.value = f; o.detune.value = (Math.random() - .5) * 12;
      lp.type = 'lowpass'; lp.frequency.value = 1100;
      g.gain.setValueAtTime(0, t); g.gain.linearRampToValueAtTime(gain, t + 2.5); g.gain.setValueAtTime(gain, t + dur - 3); g.gain.linearRampToValueAtTime(0, t + dur);
      o.connect(lp).connect(g).connect(bus); o.start(t); o.stop(t + dur + .1);
    };
    const chord = () => { const t = C.currentTime + .05; CHORDS[step++ % CHORDS.length].forEach((m, i) => { voice(hz(m), t, 9.5, i ? 'triangle' : 'sine', i ? .045 : .085); voice(hz(m) * 1.004, t, 9.5, 'sine', .025); }); };
    return {
      start() {
        try { C = new (window.AudioContext || window.webkitAudioContext)(); } catch (_) { C = null; return; }
        master = C.createGain(); master.gain.value = 0; master.connect(C.destination);
        const len = C.sampleRate * 3.5, buf = C.createBuffer(2, len, C.sampleRate);
        for (let ch = 0; ch < 2; ch++) { const d = buf.getChannelData(ch); for (let i = 0; i < len; i++) d[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / len, 2.6); }
        const rev = C.createConvolver(), wet = C.createGain(), dry = C.createGain();
        rev.buffer = buf; wet.gain.value = .6; dry.gain.value = .55;
        bus = C.createGain(); bus.connect(dry).connect(master); bus.connect(rev); rev.connect(wet).connect(master);
        master.gain.linearRampToValueAtTime(muted ? 0 : .8, C.currentTime + 3);
        step = 0; chord(); timer = setInterval(chord, 8000);
      },
      bell(i) {
        if (!C) return;
        const t = C.currentTime, top = [76, 79, 81, 84, 88][i % 5];
        [[top, .06], [top + 12, .02]].forEach(([m, g0]) => { const o = C.createOscillator(), g = C.createGain(); o.type = 'sine'; o.frequency.value = hz(m); g.gain.setValueAtTime(g0, t); g.gain.exponentialRampToValueAtTime(.0001, t + 3); o.connect(g).connect(bus); o.start(t); o.stop(t + 3.1); });
      },
      stop() {
        if (!C) return;
        clearInterval(timer);
        const c = C, m = master; C = null;
        m.gain.cancelScheduledValues(c.currentTime); m.gain.setValueAtTime(m.gain.value, c.currentTime); m.gain.linearRampToValueAtTime(0, c.currentTime + 1.5);
        setTimeout(() => c.close(), 1800);
      },
      mute(on) { muted = on; if (C) master.gain.setTargetAtTime(on ? 0 : .8, C.currentTime, .3); }
    };
  })();

  // a Russian voice reads the captions, where the browser has one
  let voiceOn = true, ruVoice = null;
  const pickVoice = () => { ruVoice = (speechSynthesis.getVoices() || []).find(v => /^ru/i.test(v.lang)) || null; $('cine-voice').hidden = !ruVoice; };
  if ('speechSynthesis' in window) { pickVoice(); speechSynthesis.onvoiceschanged = pickVoice; } else $('cine-voice').hidden = true;
  const speak = text => {
    if (!voiceOn || !ruVoice) return;
    try { speechSynthesis.cancel(); const u = new SpeechSynthesisUtterance(text); u.voice = ruVoice; u.lang = ruVoice.lang; u.rate = .95; speechSynthesis.speak(u); } catch (_) {}
  };

  const shotDir = i => { const az = .6 + i * .55, el = .22 + .14 * Math.sin(i * 1.7); return V(Math.cos(el) * Math.sin(az), Math.sin(el), Math.cos(el) * Math.cos(az)); };
  const startShot = i => {
    const sh = SHOTS[i], n = byId[sh.id];
    Object.assign(cine, { i, t0: performance.now(), hold: holdOf(sh), fromYear: cine.year, toYear: sh.year, rang: false });
    sel = sh.id; setPath(); renderCard();
    if (sh.finale) { showTo = 1; DATA.forEach(x => { if (x.flow) x.flow.material.uniforms.uBoost.value = 1.8; }); }
    flyTo(n.pos, sh.dist || DIST[n.k] + 4, shotDir(i), FLIGHT);
    capEl.classList.remove('on');
    setTimeout(() => { if (!cine || cine.i !== i) return; capEl.textContent = sh.text; capEl.classList.add('on'); speak(sh.text); }, reduce ? 0 : 900);
  };
  const startFilm = () => {
    if (cine) return;
    if (mmOn) setMind(false);
    cine = { i: 0, year: 1828, done: 0 };
    document.body.classList.add('cine');
    $('cine').hidden = false;
    requestAnimationFrame(() => requestAnimationFrame(() => $('cine').classList.add('on')));
    controls.enabled = false;
    camera.position.set(0, 60, 420); controls.target.set(0, 0, 0);
    music.start();
    startShot(0);
  };
  const endFilm = () => {
    if (!cine) return;
    cine = null;
    music.stop();
    if ('speechSynthesis' in window) speechSynthesis.cancel();
    capEl.classList.remove('on');
    $('cine').classList.remove('on');
    setTimeout(() => { if (!cine) $('cine').hidden = true; }, 900);
    document.body.classList.remove('cine');
    controls.enabled = true; controls.minDistance = 30;
    sel = 'root'; setPath(); renderCard(); $('card').hidden = false; // the hints stay open until you pick one
  };
  const cineStep = (now, dt) => {
    const el = now - cine.t0, k = Math.min(1, el / (reduce ? 1 : FLIGHT));
    cine.year = Math.round(cine.fromYear + (cine.toYear - cine.fromYear) * easeIO(k));
    yearEl.textContent = cine.year;
    if (k === 1 && !cine.rang) { cine.rang = true; music.bell(cine.i); }
    if (!fly && !reduce) { // a slow orbit while the caption is read
      const off = camera.position.clone().sub(controls.target).applyAxisAngle(UP, dt * .07).multiplyScalar(1 - dt * .01);
      camera.position.copy(controls.target).add(off);
    }
    progEl.style.width = ((cine.done + Math.min(el, FLIGHT + cine.hold)) / TOTAL * 100).toFixed(1) + '%';
    if (el > FLIGHT + cine.hold) {
      cine.done += FLIGHT + cine.hold;
      if (cine.i + 1 < SHOTS.length) startShot(cine.i + 1); else endFilm();
    }
  };
  $('b-film').addEventListener('click', startFilm);
  $('cine-exit').addEventListener('click', endFilm);
  $('cine-sound').addEventListener('click', e => { const on = e.currentTarget.getAttribute('aria-pressed') !== 'true'; e.currentTarget.setAttribute('aria-pressed', String(on)); music.mute(!on); });
  $('cine-voice').addEventListener('click', e => { voiceOn = !voiceOn; e.currentTarget.setAttribute('aria-pressed', String(voiceOn)); if (!voiceOn && 'speechSynthesis' in window) speechSynthesis.cancel(); });
  window.addEventListener('keydown', e => { if (e.key === 'Escape' && cine) { e.stopImmediatePropagation(); endFilm(); } }, true);

  const t0 = performance.now();
  let lastNow = t0;
  const tick = now => {
    requestAnimationFrame(tick);
    const t = (now - t0) / 1000, dt = Math.min(.05, (now - lastNow) / 1000);
    lastNow = now;
    showE += (showTo - showE) * Math.min(1, dt * 2.2);
    if (cine) cineStep(now, dt);
    TIME.value = reduce ? 0 : t;
    mmE = mmFrom + (mmTo - mmFrom) * (reduce ? 1 : easeIO(Math.min(1, (now - mmT0) / 1400)));
    stepFly(now);
    stepReveal(now, t);
    stepLayout(mmE);
    VAR[variant].step(now, t);
    rootGroup.scale.setScalar(1 - .45 * mmE);
    belt.visible = mmE < .3;
    controls.autoRotate = spinOn && !fly && !mmOn && !cine;
    controls.update();
    billboards.forEach(b => b.quaternion.copy(camera.quaternion));
    DATA.forEach(n => {
      if (n.k === 'root') return;
      if (n.spin) n.spin.rotation.z = t * .08;
      if (n.core.isMesh && n.k !== 'frame') n.core.rotation.y = t * .05;
      if (n.s !== 'hint') n.glow.material.uniforms.uStrength.value = n.base * (hover === n.id ? 1.6 : 1);
      const grow = (hover === n.id ? 1.15 : 1) * (1 + mmE) * (n.growing ? 1 + .12 * Math.sin(t * 9) : 1), v = vis(n), reveal = n.s === 'hint' ? .35 + .65 * v : 1, dm = dimmed(n) ? .18 : 1;
      n.badge.scale.setScalar(BR[n.k] * 2 * grow * reveal);
      n.badge.material.opacity = (n.s === 'hint' ? .35 + .65 * v : 1) * dm;
      n.hit.scale.setScalar(1 + mmE);
      if (n.flow) n.flow.material.uniforms.uOpacity.value = (n.s === 'hint' ? v : 1) * dm;
      n.badge.position.y = reduce ? 0 : Math.sin(t * 1.1 + n.phase) * .12;
    });
    belt.rotation.y = t * .01;
    pings.forEach(({ m, n }) => {
      m.visible = n.s === 'hint' ? vis(n) > .5 : mmE < .5 && hintKids(n).some(h => !h.revT0);
      if (!m.visible) return;
      const ph = reduce ? .3 : (t * (n.growing ? 1.6 : .45) + n.phase) % 1;
      m.scale.setScalar(n.R * (1 + mmE) * (1.15 + 1.1 * ph));
      m.material.opacity = .6 * (1 - ph) * (dimmed(n) ? .2 : 1);
    });
    const s = byId[sel];
    selRing.visible = sel !== 'root';
    selRing.position.copy(s.cur);
    selRing.quaternion.copy(camera.quaternion);
    selRing.rotateZ(t * .4);
    selRing.scale.setScalar(s.R * (1 + mmE) * (style === 'badges' ? 1.35 : 2.4) * (1 + (reduce ? 0 : .04 * Math.sin(t * 3))));
    stepLabels();
    renderer.render(scene, camera);
  };
  /* ---------- Живое небо: Claude grows branches and answers questions, right on the page ---------- */
  const clip = (v, k) => String(v ?? '').replace(/\s+/g, ' ').trim().slice(0, k);
  const newId = () => 'x' + Date.now().toString(36) + Math.random().toString(36).slice(2, 6);
  const okId = v => typeof v === 'string' && /^[A-Za-z0-9_-]{1,40}$/.test(v);
  const ERR = { rate_limited: 'Слишком много запросов подряд. Попробуйте через минуту.', session_expired: 'Войдите в Claude заново и попробуйте ещё раз.', invalid_json: 'Ответ получился нечитаемым. Попробуйте ещё раз.', empty_completion: 'Claude ничего не ответил. Попробуйте ещё раз.', refused: 'Claude не стал отвечать на это. Попробуйте иначе.', prompt_too_large: 'Небо стало слишком большим для одного запроса.' };
  const OFF = ['not_granted', 'sampling_disabled', 'not_declared', 'capability_disabled', 'capability_removed'];
  const errText = code => ERR[code] || 'Связь прервалась. Попробуйте ещё раз.';
  const aiOff = () => { aiSample = null; $('ask').hidden = true; renderCard(); };
  let aiDb = null, pending = { branches: [], asked: [] };

  const addHint = (par, h) => {
    const id = okId(h.id) ? h.id : newId();
    if (byId[id] || !clip(h.title, 40)) return null;
    const x = { id, p: par.id, t: clip(h.title, 40), q: clip(h.q, 90) || clip(h.title, 40), d: clip(h.d, 240), y: clip(h.year, 30), k: 'hint', s: 'hint', kids: [], c: par.c };
    DATA.push(x); byId[id] = x; par.kids.push(x); HINTS.push(x);
    placeHint(x); x.cur = x.bud.clone(); x.phase = Math.random() * 6.28;
    makeNode(x); makeFlow(x); makePing(x); makeLabel(x);
    return x;
  };
  const applyBranch = (id, b) => {
    const n = byId[id];
    if (!n || n.grown || !b || !Array.isArray(b.hints)) return false;
    Object.assign(n, { grown: true, s: 'done', k: 'frame', t: clip(b.title, 40) || n.t, y: clip(b.year, 30) || n.y, story: clip(b.story, 900), facts: (Array.isArray(b.facts) ? b.facts : []).slice(0, 5).map(x => clip(x, 200)).filter(Boolean) });
    if (!n.revT0) n.revT0 = performance.now() - 2000;
    rebuildNode(n); makeFlow(n);
    b.hints.slice(0, 3).forEach(h => h && addHint(n, h));
    makeLabel(n); makePing(n);
    n.kids.forEach(k => k.flow && makeFlow(k));
    reveal(n); layoutMM(); applyStyle(); renderList();
    return true;
  };
  const applyPending = () => { // shared branches can arrive in any order: apply whatever already has its parent
    let moved = true;
    while (moved) {
      moved = false;
      pending.branches.forEach(p => { if (byId[p.id] && !byId[p.id].grown && applyBranch(p.id, p.body)) moved = true; });
      pending.asked.forEach(p => { const b = p.body; if (!byId[p.id] && byId[b.parent] && addHint(byId[b.parent], { ...b, id: p.id })) { moved = true; layoutMM(); applyStyle(); renderList(); } });
    }
    renderCard();
  };

  aiHooks.grow = async n => {
    if (!aiSample || !n || n.s !== 'hint' || n.growing) return;
    const ctl = new AbortController();
    n.growing = { ctl, t0: performance.now() }; n.growErr = '';
    renderCard();
    const known = DATA.map(x => x.t).join('; ').slice(0, 3500);
    const prompt = `Ты помогаешь растить «Небо открытий» — трёхмерную карту знаний о Льве Толстом, его эпохе и его влиянии на мир. Зритель раскрывает ветку-намёк.
Ветка: «${n.t}». Вопрос-крючок: «${n.q}». Что о ней известно: ${n.d}
Путь на карте: ${trail(n).map(x => x.t).join(' → ')} → ${n.t}.
Уже есть на карте, не повторяй: ${known}.

Напиши содержимое этой ветки и три новые ветки-намёка, куда интересно копнуть дальше. Правила: только проверенные факты, без выдуманных цитат и чисел; если в чём-то не уверен, не пиши этого. По-русски, простыми короткими предложениями.
Ответь только JSON такого вида:
{"title": "имя ветки, 2–4 слова", "year": "год или период", "story": "4–6 предложений: ответ на вопрос-крючок и почему это важно", "facts": ["3–5 коротких фактов с датами или числами"], "hints": [{"title": "2–4 слова", "q": "вопрос-крючок до 70 знаков", "d": "одно предложение, почему это интересно"}]}
В "hints" ровно три элемента.`;
    try {
      const r = await aiSample.json(prompt, { signal: ctl.signal });
      const hints = (Array.isArray(r?.hints) ? r.hints : []).filter(h => h && h.title && h.q).slice(0, 3).map(h => ({ id: newId(), title: clip(h.title, 40), q: clip(h.q, 90), d: clip(h.d, 240) }));
      if (!r || !clip(r.story, 900) || !hints.length) throw { code: 'invalid_json' };
      const body = { title: clip(r.title, 40), year: clip(r.year, 30), story: clip(r.story, 900), facts: (Array.isArray(r.facts) ? r.facts : []).slice(0, 5).map(x => clip(x, 200)), hints, at: Date.now() };
      n.growing = null;
      applyBranch(n.id, body);
      if (aiDb) aiDb.collection('branches').doc(n.id).set(body).catch(() => {});
    } catch (e) {
      if (OFF.includes(e.code)) { n.growing = null; return aiOff(); }
      n.growErr = e.code === 'cancelled' ? '' : errText(e.code);
    } finally { n.growing = null; renderCard(); }
  };
  setInterval(() => { const el = $('grow-t'), n = byId[sel]; if (el && n.growing) el.textContent = Math.round((performance.now() - n.growing.t0) / 1000); }, 500);

  // Спросите небо: a short answer, a tour through the nodes that show it, and sometimes a new hint
  let tourT = null, askCtl = null;
  aiHooks.stopTour = () => clearTimeout(tourT);
  const tour = ids => { clearTimeout(tourT); let i = 0; const next = () => { if (i < ids.length) { focusFn(ids[i++]); tourT = setTimeout(next, 3400); } }; next(); };
  const askOut = (text, chips) => {
    $('ask-out').hidden = false; $('ask-text').textContent = text;
    $('ask-nodes').innerHTML = (chips || []).map(n => `<button type="button" class="nchip${n.fresh ? ' new' : ''}" data-go="${n.id}" style="--c:${hexOf(n)}">${n.fresh ? '✦ ' : ''}${esc(n.t)}</button>`).join('');
  };
  $('ask').addEventListener('submit', async e => {
    e.preventDefault();
    if (askCtl) { askCtl.abort(); return; }
    const q = clip($('ask-q').value, 200);
    if (!q || !aiSample) return;
    askCtl = new AbortController();
    $('ask-go').textContent = 'Стоп';
    askOut('Думаю…', []);
    const map = DATA.map(x => `${x.id} | ${x.t} | ${clip(x.q || x.d, 110)}`).slice(0, 160).join('\n');
    const prompt = `Ты гид по «Небу открытий» — карте знаний о Льве Толстом и его влиянии. Вот все ноды карты (id | название | вопрос или описание):
${map}

Вопрос зрителя: «${q}»
Ответь по-русски, коротко: 2–4 простых предложения, только проверенные факты. Выбери до четырёх нод, которые лучше всего показывают ответ, в порядке показа (только id из списка). Если подходящей ветки на карте нет, предложи одну новую ветку-намёк и укажи id ноды, к которой её прикрепить.
Ответь только JSON: {"answer": "...", "nodes": ["id"], "new_hint": null или {"parent": "id", "title": "2–4 слова", "q": "вопрос-крючок до 70 знаков", "d": "одно предложение"}}`;
    try {
      const r = await aiSample.json(prompt, { signal: askCtl.signal, modelTier: 'quick', cache: false });
      const ids = (Array.isArray(r?.nodes) ? r.nodes : []).filter(id => byId[id]).slice(0, 4);
      const chips = ids.map(id => byId[id]);
      const h = r?.new_hint;
      if (h && byId[h.parent] && clip(h.title, 40)) {
        const x = addHint(byId[h.parent], { id: newId(), title: h.title, q: h.q, d: h.d });
        if (x) {
          x.fresh = true; reveal(byId[h.parent]); layoutMM(); applyStyle(); renderList(); chips.push(x); ids.push(x.id);
          if (aiDb) aiDb.collection('asked').doc(x.id).set({ parent: h.parent, title: x.t, q: x.q, d: x.d, at: Date.now() }).catch(() => {});
        }
      }
      askOut(clip(r?.answer, 700) || 'Не нашёл ответа на карте.', chips);
      if (ids.length) tour(ids);
    } catch (err) {
      if (OFF.includes(err.code)) aiOff();
      else askOut(err.code === 'cancelled' ? 'Остановлено.' : errText(err.code), []);
    } finally { askCtl = null; $('ask-go').textContent = 'Спросить'; }
  });

  // light the features up once the viewer says Claude may run here; keep grown branches for everyone
  (async () => {
    const cl = window.claude;
    if (!cl || !cl.use) return;
    const [smp, db] = await Promise.all([cl.use('sample'), cl.use('db')]);
    if (smp) { aiSample = smp; $('ask').hidden = false; renderCard(); }
    if (db) {
      aiDb = db;
      const keep = key => snap => { pending[key] = snap.docs.filter(d => d.exists && okId(d.id)).map(d => ({ id: d.id, body: d.data() })); applyPending(); };
      db.collection('branches').onSnapshot(keep('branches'), () => {});
      db.collection('asked').onSnapshot(keep('asked'), () => {});
    }
  })();

  applyStyle();
  VAR.medal.start();
  focusFn('root');
  requestAnimationFrame(tick);
  setTimeout(acted, 12000);
  };
  renderCard();
  Promise.race([document.fonts ? document.fonts.ready : Promise.resolve(), new Promise(r => setTimeout(r, 1500))]).then(init3D);
})();
</script>
